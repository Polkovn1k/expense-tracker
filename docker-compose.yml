services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: expense_tracker
      POSTGRES_PASSWORD: expense_tracker
      POSTGRES_DB: expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  dbhub:
    image: bytebase/dbhub:latest
    container_name: expense-tracker-dbhub
    restart: unless-stopped
    ports:
      - "8080:8080"
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --dsn
      - "postgres://expense_tracker:expense_tracker@postgres:5432/expense_tracker?sslmode=disable"
    depends_on:
      - postgres

volumes:
  postgres_data:
